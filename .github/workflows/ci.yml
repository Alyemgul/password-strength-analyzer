name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build, test, analyze, and generate coverage on Linux or macOS
        if: runner.os != 'Windows'
        run: ./gradlew clean check build jacocoTestReport

      - name: Build, test, analyze, and generate coverage on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat clean check build jacocoTestReport

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports-${{ matrix.os }}
          path: |
            **/build/reports/jacoco/
          if-no-files-found: ignore

      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports-${{ matrix.os }}
          path: |
            **/build/reports/spotbugs/
          if-no-files-found: ignore

      - name: Upload application distribution
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: password-strength-analyzer
          path: |
            app/build/distributions/
          if-no-files-found: error

  integration-test:
    name: Integration Test - ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Install application on Linux or macOS
        if: runner.os != 'Windows'
        run: ./gradlew :app:installDist

      - name: Install application on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat :app:installDist

      - name: Run Bash integration tests
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/integration-test.sh
          ./scripts/integration-test.sh

      - name: Run PowerShell integration tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/integration-test.ps1